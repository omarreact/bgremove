<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BG REMOVE - PINCODE TECH</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container d-flex justify-content-between align-items-center">
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="#"
          onclick="location.reload()"
        >
          <i class="bi bi-stars text-primary"></i>
          <span class="fw-bold text-dark"
            >BG Remove By <span class="text-primary">PINCODE TECH</span></span
          >
        </a>

        <div class="d-flex gap-2">
          <button
            id="newImageBtn"
            class="btn btn-outline-secondary btn-sm rounded-pill px-3"
            style="display: none"
          >
            <i class="bi bi-plus-lg"></i> Upload New
          </button>

          <button
            id="downloadBtn"
            class="btn btn-primary btn-sm rounded-pill px-4"
            disabled
          >
            Download HD
          </button>
        </div>
      </div>
    </nav>

    <div class="main-layout">
      <div id="uploadView" class="upload-container">
        <h1 class="fw-bold mb-3">Upload Image</h1>
        <p class="text-muted mb-4">
          Remove backgrounds automatically, then refine with tools.
        </p>

        <div
          class="upload-box"
          id="dropZone"
          onclick="document.getElementById('fileInput').click()"
        >
          <i class="bi bi-cloud-arrow-up text-primary fs-1 mb-3"></i>
          <h5 class="fw-bold">Click to Upload</h5>
          <p class="text-muted small mb-0">or drag and drop an image here</p>
        </div>
        <input type="file" id="fileInput" accept="image/*" hidden />
      </div>

      <div id="editorView" class="editor-container">
        <div id="loader" class="loader-overlay" style="display: none">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-3 fw-bold text-dark" id="loaderText">Processing...</p>
          <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
          </div>
        </div>

        <div class="canvas-wrapper" id="canvasWrapper">
          <canvas id="mainCanvas"></canvas>
          <div
            id="brushCursor"
            style="
              pointer-events: none;
              position: fixed;
              border: 2px solid #333;
              border-radius: 50%;
              transform: translate(-50%, -50%);
              display: none;
              z-index: 100;
              box-shadow: 0 0 0 1px white;
            "
          ></div>
        </div>

        <div class="sidebar">
          <div class="tool-section pb-3 border-bottom">
            <div class="btn-group w-100" role="group">
              <input
                type="radio"
                class="btn-check"
                name="viewMode"
                id="viewEdited"
                autocomplete="off"
                checked
              />
              <label class="btn btn-outline-primary btn-sm" for="viewEdited"
                >Edited</label
              >

              <input
                type="radio"
                class="btn-check"
                name="viewMode"
                id="viewOriginal"
                autocomplete="off"
              />
              <label class="btn btn-outline-primary btn-sm" for="viewOriginal"
                >Original</label
              >
            </div>
          </div>

          <div class="tool-section mt-3">
            <div class="section-title">Manual Refinement</div>
            <p class="small text-muted mb-2">
              Fix the AI's mistakes by painting.
            </p>

            <div class="brush-btn-group mb-3">
              <button
                class="brush-btn active"
                id="toolErase"
                onclick="setTool('erase')"
              >
                <i class="bi bi-eraser-fill"></i> Erase
              </button>
              <button
                class="brush-btn"
                id="toolRestore"
                onclick="setTool('restore')"
              >
                <i class="bi bi-brush-fill"></i> Restore
              </button>
            </div>

            <label class="form-label small fw-bold">Brush Size</label>
            <input
              type="range"
              class="form-range"
              id="brushSize"
              min="5"
              max="100"
              value="20"
            />
          </div>

          <div class="tool-section">
            <div class="section-title">Background</div>

            <div class="swatch-grid mb-2">
              <div
                class="swatch swatch-transparent active"
                onclick="setBgColor('transparent', this)"
              ></div>
              <div
                class="swatch"
                style="background: #ffffff"
                onclick="setBgColor('#ffffff', this)"
              ></div>
              <div
                class="swatch"
                style="background: #000000"
                onclick="setBgColor('#000000', this)"
              ></div>
              <div
                class="swatch"
                style="background: #f87171"
                onclick="setBgColor('#f87171', this)"
              ></div>
              <div
                class="swatch"
                style="background: #fbbf24"
                onclick="setBgColor('#fbbf24', this)"
              ></div>
              <div
                class="swatch"
                style="
                  background: conic-gradient(
                    red,
                    violet,
                    blue,
                    lime,
                    yellow,
                    red
                  );
                "
              >
                <input
                  type="color"
                  id="colorPicker"
                  style="opacity: 0; width: 100%; height: 100%; cursor: pointer"
                />
              </div>
            </div>

            <button
              class="btn btn-outline-secondary btn-sm w-100 mt-2"
              onclick="document.getElementById('bgFileInput').click()"
            >
              <i class="bi bi-image"></i> Upload BG Image
            </button>
            <input type="file" id="bgFileInput" accept="image/*" hidden />
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
